[package]
name = "temper"
version = "0.1.0"
edition = "2024"
description = "Temper — Quantum-safe cryptographic protocol with hardened entropy and dual PQC signatures. Fully no_std for embedded."
license = "Apache-2.0"
repository = "https://github.com/Sing-Security/temper"
keywords = ["cryptography", "post-quantum", "no-std", "embedded", "blake3"]
categories = ["cryptography", "no-std"]

[lib]
doctest = false

[features]
default = ["std"]
std = ["alloc", "blake3/std", "hex/std"]
alloc = []

# Performance features (std only)
blake3_simd = ["std", "blake3/neon", "blake3/prefer_intrinsics"]
blake3_parallel = ["blake3_simd", "dep:rayon"]

# Hybrid KEM/AEAD (optional, no_std + alloc compatible)
envelope = ["dep:ml-kem", "dep:x25519-dalek", "dep:chacha20poly1305"]

# Hardware entropy example (optional, no_std compatible)
hardware_example = []

[dependencies]
# -- Cryptography
blake3 = { version = "1", default-features = false }
ml-dsa = { version = "0.1.0-rc.7", default-features = false, features = ["zeroize"] }
slh-dsa = { version = "0.2.0-rc.4", default-features = false, features = ["zeroize"] }

# -- Hybrid KEM/AEAD (optional)
ml-kem = { version = "0.2.0-rc.2", default-features = false, optional = true }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"], optional = true }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"], optional = true }

# -- DRBG
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }

# -- Entropy seeding
getrandom = { version = "0.2", default-features = false }

# -- Serialization
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

# -- Concurrency (no_std spinlock)
spin = "0.9"

# -- Encoding
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# -- Secure memory
zeroize = { version = "1", default-features = false }

# -- Error handling (no_std compatible proc-macro)
derive_more = { version = "2", default-features = false, features = ["from", "display"] }

# -- Parallel processing (optional, std only)
rayon = { version = "1.10", optional = true }

[dev-dependencies]
rand = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }

# Benchmarks
[[bench]]
name = "seal_bench"
harness = false
required-features = ["std"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Speed-optimized profile for server deployments
[profile.release-server]
inherits = "release"
opt-level = 3
lto = "thin"
strip = false  # Keep debug info for profiling

[profile.bench]
inherits = "release"
opt-level = 3
lto = "thin"
